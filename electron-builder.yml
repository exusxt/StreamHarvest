appId: com.streamharvest.app
productName: StreamHarvest
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
win:
  target:
    - nsis
    - portable
  icon: build/icon.png
  executableName: StreamHarvest
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: StreamHarvest-Setup-${version}.${ext}
portable:
  artifactName: StreamHarvest-${version}.${ext}
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  executableName: streamharvest
  icon: build/icon.png
  desktop:
    Name: StreamHarvest
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
        - arm64
  category: Utility
  maintainer: streamharvest-tools
  synopsis: Download videos from most streaming and video-hosting sites
npmRebuild: false
publish:
  provider: github
  owner: exusxt
  repo: StreamHarvest
  releaseType: release
